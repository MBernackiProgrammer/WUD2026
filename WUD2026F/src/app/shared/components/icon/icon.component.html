@if (name === 'home') {
  <app-brand-symbol [compact]="true" />
} @else {
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path [attr.d]="paths[name] || paths['arrow']" />
  </svg>
}
